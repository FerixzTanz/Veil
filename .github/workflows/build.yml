name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # The AirPlay receiver is a native library: NDK and CMake, same versions as app/build.gradle.kts
      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # OpenSSL is built from source once per runner image; keep it between runs
      - name: Cache the native build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**') }}
          restore-keys: cxx-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Write the release keystore
        if: env.VEIL_KEYSTORE_BASE64 != ''
        env:
          VEIL_KEYSTORE_BASE64: ${{ secrets.VEIL_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$VEIL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/veil-release.jks"
          echo "VEIL_KEYSTORE=$RUNNER_TEMP/veil-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VEIL_KEYSTORE_PASSWORD: ${{ secrets.VEIL_KEYSTORE_PASSWORD }}
          VEIL_KEY_ALIAS: ${{ secrets.VEIL_KEY_ALIAS }}
          VEIL_KEY_PASSWORD: ${{ secrets.VEIL_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          VERSION=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          OUT="Veil-${VERSION}-${SHORT_SHA}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Veil-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # A v* tag publishes a release. The notes are that version's section of CHANGELOG.md,
      # and a version with a suffix (-alpha, -beta, -rc1) is a pre-release.
      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.apk.outputs.version }}" ]; then
            echo "tag v$TAG does not match versionName ${{ steps.apk.outputs.version }} in app/build.gradle.kts"
            exit 1
          fi

      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${{ steps.apk.outputs.version }}"
          NOTES=$(awk -v v="$VERSION" '
            /^## / { if (found) exit; found = index($0, "## " v) == 1; next }
            found { print }
          ' CHANGELOG.md)
          printf '%s\n' "$NOTES" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No section for $VERSION in CHANGELOG.md" > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          prerelease: ${{ contains(steps.apk.outputs.version, '-') }}
          draft: false
          name: ${{ steps.apk.outputs.version }}
          body_path: RELEASE_NOTES.md
